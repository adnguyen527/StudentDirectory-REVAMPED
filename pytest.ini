[pytest]
testpaths = tests
markers =
    integration: read-only checks against the real MongoDB cluster (run with --integration)
filterwarnings =
    # mongomock calls the deprecated datetime.utcnow() internally, once per TTL-indexed
    # write -- 90 lines after every run, from a library we do not control. Scoped to that
    # module by name so our own deprecation warnings still show up.
    ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock.helpers
